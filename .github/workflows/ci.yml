name: CityPulse checks
on:
  push:
    paths-ignore: ['dist/live-snapshot.json', 'dist/live-history.json', 'dist/transit-schedule.json']
  pull_request:
jobs:
  pipeline-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m pipelines.run --days 21
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      - run: python -m pytest -q
      - run: node --check dist/app.js
      - run: node --test tests/live.test.cjs
      - run: docker build -f docker/Dockerfile -t citypulse:test .
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: data/models/metrics.json

